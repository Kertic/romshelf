[workspace]
resolver = "2"
members = ["crates/romshelf-core", "crates/romshelf-testkit", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
url = "2"
