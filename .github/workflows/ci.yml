name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # The release workflow reuses this build.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    # SteamOS 3 is Arch-based with a recent glibc; building on 22.04 keeps the AppImage's glibc floor low.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libfuse2 file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
            e2e/package-lock.json

      - name: Install front-end packages
        run: |
          npm ci
          npm ci --prefix ui

      - name: Front end lint, test, build
        run: |
          npm --prefix ui run lint
          npm --prefix ui test
          npm --prefix ui run build

      - name: Installer script
        run: shellcheck scripts/install.sh

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Build AppImage
        run: npx tauri build --bundles appimage

      # Stage 9's end-to-end flows and visual regression: the release binary in fake mode under
      # tauri-driver (WebKitWebDriver) on a virtual display, driven only by gamepad keys.
      - name: WebDriver tools
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --locked
          npm ci --prefix e2e

      - name: End-to-end tests
        timeout-minutes: 20
        env:
          # No Linux baselines yet: this run writes them (in the artifact below) to review and commit.
          ROMSHELF_E2E_UPDATE: ${{ hashFiles('e2e/screens/linux/*.png') == '' && '1' || '0' }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm --prefix e2e test

      - name: End-to-end screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: |
            e2e/out/
            e2e/screens/linux/
          if-no-files-found: ignore

      - name: Rename AppImage
        run: |
          mkdir -p out
          cp target/release/bundle/appimage/*.AppImage out/romshelf.AppImage
          chmod +x out/romshelf.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: romshelf-appimage
          path: out/romshelf.AppImage
          if-no-files-found: error
